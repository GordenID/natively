<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>natively</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></symbol>
  <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7l-6 6h-7a2 2 0 0 1-2-2z"/><path d="M19.5 13.5h-4a2 2 0 0 0-2 2v4"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M12 3v6M9 6.5l3 2.5 3-2.5M12 21v-6M9 17.5l3-2.5 3 2.5M5 12h14"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9.5 7h10M9.5 12h10M9.5 17h10M4.5 7h.5M4.5 12h.5M4.5 17h.5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01" stroke-width="2.6"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5L13.5 10.5M10 19.5H4.5V14M4.5 19.5l6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5h9.75a3.75 3.75 0 0 0 .5-7.47A5.5 5.5 0 0 0 7.2 9.4a4.5 4.5 0 0 0 .3 9.1z"/></symbol>
  <symbol id="i-drive" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="6" rx="1.8"/><rect x="3.5" y="13" width="17" height="6" rx="1.8"/><path d="M7 8h.01M7 16h.01" stroke-width="2.4"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="10" rx="1.6"/><path d="M3 19h18"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3H7l3-3zM12 15v5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
  <symbol id="i-width" viewBox="0 0 24 24"><path d="M4 12h16M7.5 8.5L4 12l3.5 3.5M16.5 8.5L20 12l-3.5 3.5"/></symbol>
  <symbol id="i-text" viewBox="0 0 24 24"><path d="M3.5 18l4-11 4 11M5 14h5M15 11.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM18 11v7"/></symbol>
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M3.5 7.2A2.2 2.2 0 0 1 5.7 5h3.4c.6 0 1.1.25 1.5.7l1.3 1.5c.4.45.95.7 1.55.7h4.85a2.2 2.2 0 0 1 2.2 2.2v6.7a2.2 2.2 0 0 1-2.2 2.2H5.7a2.2 2.2 0 0 1-2.2-2.2z"/><circle cx="16.3" cy="12.9" r="1" stroke-width="0.9"/></symbol>
  <symbol id="i-enter" viewBox="0 0 24 24"><path d="M19.5 5v7a3 3 0 0 1-3 3h-11M9 11l-4 4 4 4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M10 15l-5-5 5-5"/><path d="M5 10h9a5 5 0 0 1 0 10h-2"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="nav" id="nav" aria-label="Navigation" data-i18n-aria="nav.aria">
    <div class="nav-top">
      <button class="iconbtn" data-act="nav-toggle" title="Hide sidebar (⌘\)" aria-label="Hide sidebar" data-i18n-title="nav.hide" data-i18n-aria="nav.hideLabel"><svg class="i"><use href="#i-sidebar"/></svg></button>
      <button class="iconbtn" data-act="back" id="navBack" title="Back (⌘[)" aria-label="Back" data-i18n-title="nav.back" data-i18n-aria="nav.backLabel"><svg class="i"><use href="#i-chev-left"/></svg></button>
      <button class="iconbtn" data-act="fwd" id="navFwd" title="Forward (⌘])" aria-label="Forward" data-i18n-title="nav.fwd" data-i18n-aria="nav.fwdLabel"><svg class="i"><use href="#i-chev-right"/></svg></button>
    </div>
    <div class="nav-scroll">
      <button class="nitem" data-act="new-tab"><svg class="i"><use href="#i-plus"/></svg><span class="lbl" data-i18n="nav.newTab">New tab</span><kbd>⌘T</kbd></button>
      <button class="nitem" data-act="search"><svg class="i"><use href="#i-search"/></svg><span class="lbl" data-i18n="nav.search">Search</span><kbd>⌘⇧M</kbd></button>
      <button class="nitem" data-act="sources" id="navSources"><svg class="i"><use href="#i-folder-plus"/></svg><span class="lbl" data-i18n="nav.sources">Sources</span></button>
      <div class="nsec" id="navPinned"></div>
      <div class="nsec" id="navRecent"></div>
    </div>
    <div class="nav-foot">
      <span class="brand"><svg class="i"><use href="#i-logo"/></svg>natively <small id="appVersion"></small></span>
      <button class="langbtn" data-act="lang" id="langBtn" data-i18n="lang.label" data-i18n-title="lang.title" data-i18n-aria="lang.title" title="Sprache: Deutsch">EN</button>
    </div>
  </aside>
  <div class="resizer nav-resizer" id="navResizer" role="separator" aria-orientation="vertical" aria-label="Sidebar width" data-i18n-aria="nav.width" tabindex="0"></div>

  <main class="main">
    <header class="topbar">
      <div class="navctl">
        <button class="iconbtn" data-act="nav-toggle" title="Show sidebar (⌘\)" aria-label="Show sidebar" data-i18n-title="nav.show" data-i18n-aria="nav.showLabel"><svg class="i"><use href="#i-sidebar"/></svg></button>
        <button class="iconbtn" data-act="back" id="topBack" title="Back (⌘[)" aria-label="Back" data-i18n-title="nav.back" data-i18n-aria="nav.backLabel"><svg class="i"><use href="#i-chev-left"/></svg></button>
        <button class="iconbtn" data-act="fwd" id="topFwd" title="Forward (⌘])" aria-label="Forward" data-i18n-title="nav.fwd" data-i18n-aria="nav.fwdLabel"><svg class="i"><use href="#i-chev-right"/></svg></button>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Open files" data-i18n-aria="tabs.aria"></div>
      <button class="iconbtn" data-act="new-tab" title="New tab (⌘T)" aria-label="New tab" data-i18n-title="nav.newTabKey" data-i18n-aria="nav.newTab"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="iconbtn" data-act="search" title="Search (⌘⇧M)" aria-label="Search" data-i18n-title="nav.searchKey" data-i18n-aria="nav.search"><svg class="i"><use href="#i-search"/></svg></button>
    </header>
    <div class="crumbbar" id="crumbbar"></div>
    <div class="body">
      <section class="content" id="content"></section>
      <div class="resizer tree-resizer" id="treeResizer" role="separator" aria-orientation="vertical" aria-label="File list width" data-i18n-aria="tree.width" tabindex="0"></div>
      <aside class="tree" id="tree" aria-label="Markdown files" data-i18n-aria="tree.aria">
        <div class="tree-head">
          <label class="filter"><svg class="i"><use href="#i-search"/></svg><input id="treeFilter" type="text" placeholder="Filter, or ? for full-text search" data-i18n-ph="tree.filter" autocomplete="off" spellcheck="false"></label>
        </div>
        <div class="tree-scroll" id="treeList" role="tree"></div>
        <div class="tree-foot" id="treeFoot"></div>
      </aside>
    </div>
  </main>
  <div class="scrim" id="scrim" data-act="scrim" hidden></div>
</div>

<div class="overlay" id="search" hidden>
  <div class="s-dialog" role="dialog" aria-modal="true" aria-label="Search Markdown files" data-i18n-aria="search.aria">
    <div class="s-head">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="sq" type="text" placeholder="Search all Markdown files" data-i18n-ph="search.placeholder" autocomplete="off" spellcheck="false" aria-controls="sList">
      <button class="iconbtn" data-act="close-search" title="Close" aria-label="Close search" data-i18n-title="close" data-i18n-aria="search.close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="s-filters">
      <button class="chip" id="chipTitle" data-act="title-only" aria-pressed="false"><svg class="i"><use href="#i-text"/></svg><span data-i18n="search.titleOnly">Titles only</span></button>
      <span class="s-sep" aria-hidden="true"></span>
      <label class="chip sel"><svg class="i"><use href="#i-folder-plus"/></svg><select id="sSrc" aria-label="Source" data-i18n-aria="search.source"></select></label>
      <label class="chip sel"><svg class="i"><use href="#i-sliders"/></svg><select id="sSort" aria-label="Sort" data-i18n-aria="search.sort"><option value="best" data-i18n="search.best">Best matches</option><option value="recent" data-i18n="search.recent">Recently changed</option></select></label>
    </div>
    <div class="s-body">
      <div class="s-results"><div class="s-count" id="sCount"></div><div id="sList" role="listbox" aria-label="Search results" data-i18n-aria="search.results"></div></div>
      <aside class="s-preview" id="sPrev" aria-label="Preview" data-i18n-aria="search.preview"></aside>
    </div>
    <div class="s-foot"><span><kbd>↵</kbd> <span data-i18n="search.keyOpen">Open</span></span><span><kbd>⌘</kbd><kbd>↵</kbd> <span data-i18n="search.keyTab">New tab</span></span><span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="search.keySelect">Select</span></span><span><kbd>esc</kbd> <span data-i18n="search.keyClose">Close</span></span></div>
  </div>
</div>

<div class="overlay" id="tableOverlay" hidden>
  <div class="t-dialog" role="dialog" aria-modal="true" aria-label="Table" data-i18n-aria="table.aria">
    <div class="t-head"><span id="tTitle"></span><button class="iconbtn" data-act="close-table" aria-label="Close table" data-i18n-aria="table.close"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="t-body md" id="tBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="i18n.js"></script>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
